<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Workspace{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container">
            <a class="brand" href="/dashboard">AI Workspace</a>
            <nav>
                {% if request.cookies.get('session') %}
                    <form action="/logout" method="post" style="display:inline">
                        <button type="submit" class="btn secondary">Logout</button>
                    </form>
                {% else %}
                    <a class="btn secondary" href="/login">Login</a>
                    <a class="btn primary" href="/register">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container"><p>Full-Stack AI Workspace -- Portfolio Project</p></footer>
</body>
</html>
